{# Set nav before include: events | weekend | contact #}
<header class="top site-header">
  <div class="site-header-inner">
    <a class="brand" href="{{ url_for('index') }}">
      <strong>NightLife MK</strong>
      <span>Откриј ноќни настани</span>
    </a>
    <nav class="site-nav" aria-label="Главна навигација">
      <button type="button" class="pwa-install-btn" id="pwa-install-btn">Инсталирај апликација</button>
      <a href="{{ url_for('index') }}" class="{% if nav == 'events' %}is-active{% endif %}">Евенти</a>
      <a href="{{ url_for('weekend_surprise') }}" class="{% if nav == 'weekend' %}is-active{% endif %}">Изненади ме!</a>
      <a href="{{ url_for('suggest_account') }}" class="{% if nav == 'suggest' %}is-active{% endif %}">Предложи профил</a>
      <a href="{{ url_for('contact') }}" class="{% if nav == 'contact' %}is-active{% endif %}">Контакт</a>
    </nav>
  </div>
</header>
{% include '_pwa_install.html' %}
<script>
(function () {
  var h = document.querySelector('header.top.site-header');
  if (!h || !window.matchMedia) return;
  var mq = window.matchMedia('(max-width: 640px)');
  function tick() {
    if (!mq.matches) {
      h.classList.remove('header-scrolled');
      return;
    }
    h.classList.toggle('header-scrolled', window.scrollY > 10);
  }
  window.addEventListener('scroll', tick, { passive: true });
  if (mq.addEventListener) mq.addEventListener('change', tick);
  else if (mq.addListener) mq.addListener(tick);
  tick();
})();
</script>
